services:

  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Pre-built processed data and FAISS indices (gitignored, must exist locally)
      - ./data/processed:/app/data/processed:ro
      - ./outputs/indices:/app/outputs/indices
      # HuggingFace model cache — persisted so the encoder is only downloaded once
      - hf_cache:/root/.cache/huggingface
    environment:
      # Reaches the Ollama daemon already running on the host machine
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PYTHONPATH=/app
    extra_hosts:
      # Resolves host.docker.internal on Linux (no-op on Mac/Windows where it is built-in)
      - "host.docker.internal:host-gateway"
    restart: on-failure

volumes:
  hf_cache:
