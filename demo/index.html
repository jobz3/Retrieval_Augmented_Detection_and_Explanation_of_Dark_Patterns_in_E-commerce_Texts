<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Pattern Detector</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e334d;
    --text: #e8eaf6;
    --text-muted: #8b90ab;
    --accent: #5c6bc0;
    --accent-hover: #7986cb;
    --radius: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(135deg, #1a1d27 0%, #12152a 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px 18px;
    flex-shrink: 0;
  }

  header h1 { font-size: 1.4rem; font-weight: 700; color: #c5cae9; letter-spacing: -0.02em; }
  header p  { color: var(--text-muted); font-size: 0.85rem; margin-top: 3px; }

  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .badge {
    font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 20px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted);
  }

  /* ── top input bar ── */
  .input-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .tabs {
    display: flex; gap: 3px;
    background: var(--surface2); border-radius: 7px; padding: 3px;
  }

  .tab-btn {
    background: none; border: none; color: var(--text-muted);
    padding: 6px 14px; border-radius: 5px; font-size: 0.83rem;
    cursor: pointer; transition: all 0.15s; font-weight: 500; white-space: nowrap;
  }
  .tab-btn.active { background: var(--accent); color: #fff; }

  .input-wrap { flex: 1; min-width: 260px; }
  .field-label {
    font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  input[type="url"], textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text); font-size: 0.9rem;
    padding: 9px 12px; outline: none; transition: border-color 0.15s; font-family: inherit;
  }
  input[type="url"]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }

  .analyze-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 7px;
    padding: 9px 22px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: background 0.15s; display: inline-flex; align-items: center;
    gap: 7px; white-space: nowrap; align-self: flex-end;
  }
  .analyze-btn:hover { background: var(--accent-hover); }
  .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── main content area ── */
  .content-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── webpage preview pane ── */
  #preview-pane {
    flex: 1;
    display: none;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: #fff;
    position: relative;
  }

  #preview-pane.visible { display: flex; }

  .preview-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #1e2130;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .preview-toolbar .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot-red   { background: #e74c3c; }
  .dot-yellow{ background: #f39c12; }
  .dot-green { background: #27ae60; }

  .preview-url-bar {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 10px; font-size: 0.78rem; color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .preview-status {
    font-size: 0.75rem; color: var(--text-muted); white-space: nowrap;
  }

  #page-iframe {
    flex: 1;
    width: 100%;
    border: none;
  }

  .preview-overlay {
    position: absolute;
    inset: 42px 0 0 0; /* below toolbar */
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15,17,23,0.85);
    flex-direction: column;
    gap: 12px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .preview-overlay.hidden { display: none; }

  /* ── findings pane ── */
  #findings-pane {
    width: 420px;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }

  /* When no preview (text mode), findings take full width */
  .content-area.no-preview #findings-pane {
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
  }

  /* ── results ── */
  .results-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .results-header h2 { font-size: 1rem; font-weight: 600; }
  .summary-pills { display: flex; gap: 6px; }
  .pill { font-size: 0.77rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .pill-dark  { background: rgba(231,76,60,0.18);  color: #e74c3c; border: 1px solid rgba(231,76,60,0.3); }
  .pill-clean { background: rgba(39,174,96,0.15);  color: #27ae60; border: 1px solid rgba(39,174,96,0.3); }

  .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .filter-btn {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
    color: var(--text-muted); font-size: 0.74rem; font-weight: 600; padding: 3px 10px;
    cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  .finding-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
    transition: border-color 0.15s;
  }
  .finding-card:hover { border-color: #4a4f72; }

  .card-header {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; cursor: pointer; user-select: none;
  }
  .label-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .label-name { font-weight: 700; font-size: 0.85rem; flex: 1; }
  .snippet-preview {
    font-size: 0.78rem; color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
  }
  .confidence-bar-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .confidence-bar-bg {
    width: 60px; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden;
  }
  .confidence-bar-fill { height: 100%; border-radius: 3px; }
  .conf-pct { font-size: 0.75rem; color: var(--text-muted); min-width: 30px; text-align: right; }
  .chevron { color: var(--text-muted); font-size: 0.7rem; transition: transform 0.2s; flex-shrink: 0; }
  .finding-card.open .chevron { transform: rotate(180deg); }

  .card-body {
    display: none; padding: 0 14px 14px; border-top: 1px solid var(--border);
  }
  .finding-card.open .card-body { display: block; }

  .section { margin-top: 12px; }
  .section-label {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 4px;
  }
  .section-text { font-size: 0.84rem; line-height: 1.5; color: var(--text); }

  .span-highlight {
    background: rgba(255,200,40,0.22); border-bottom: 2px solid rgba(255,200,40,0.7);
    border-radius: 3px; padding: 0 2px; font-weight: 600; color: #ffe082;
  }
  .rewrite-box {
    background: rgba(39,174,96,0.08); border: 1px solid rgba(39,174,96,0.25);
    border-radius: 6px; padding: 8px 10px; font-size: 0.84rem; color: #a5d6a7; line-height: 1.45;
  }
  .meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .meta-chip {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 8px; font-size: 0.74rem;
  }
  .meta-chip span:first-child {
    color: var(--text-muted); font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; margin-right: 4px;
  }

  .error-banner {
    background: rgba(231,76,60,0.12); border: 1px solid rgba(231,76,60,0.3);
    border-radius: 8px; padding: 12px 16px; color: #ef9a9a; font-size: 0.88rem;
  }
  .info-note { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; font-style: italic; }
  .no-results { text-align: center; color: var(--text-muted); padding: 30px; font-size: 0.88rem; }

  /* placeholder when nothing analysed yet */
  #empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-muted); text-align: center; gap: 10px; padding: 40px;
  }
  #empty-state svg { opacity: 0.25; }
  #empty-state p { font-size: 0.88rem; }
</style>
</head>
<body>

<header>
  <h1>Dark Pattern Detector</h1>
  <p>RAG-augmented detection and explanation of manipulative e-commerce texts · HCNLP 2026</p>
  <div class="badge-row">
    <span class="badge">SBERT KNN k=5</span>
    <span class="badge">Qwen3-8B</span>
    <span class="badge">Macro F1 = 0.923</span>
    <span class="badge">8 Pattern Classes</span>
    <span class="badge">EU DSA Article 25</span>
  </div>
</header>

<div class="input-bar">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('url')">Analyse URL</button>
    <button class="tab-btn"        onclick="switchTab('text')">Analyse Text</button>
  </div>

  <div class="input-wrap">
    <div id="tab-url" class="tab-panel active">
      <div class="field-label">Website URL</div>
      <input type="url" id="url-input" placeholder="https://www.example-shop.com/product/123"
             onkeydown="if(event.key==='Enter') runAnalysis()">
    </div>
    <div id="tab-text" class="tab-panel">
      <div class="field-label">Product Text</div>
      <textarea id="text-input" placeholder="Only 2 left in stock — order soon!"
                onkeydown="if(event.ctrlKey&&event.key==='Enter') runAnalysis()"
                rows="2"></textarea>
    </div>
  </div>

  <button class="analyze-btn" id="analyze-btn" onclick="runAnalysis()">
    <div class="spinner" id="spinner"></div>
    <span id="btn-label">Analyse</span>
  </button>
</div>

<!-- ── two-column content area ── -->
<div class="content-area no-preview" id="content-area">

  <!-- LEFT: webpage preview -->
  <div id="preview-pane">
    <div class="preview-toolbar">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
      <div class="preview-url-bar" id="preview-url-bar">—</div>
      <div class="preview-status" id="preview-status"></div>
    </div>
    <iframe id="page-iframe"
            sandbox="allow-same-origin allow-forms"
            title="Webpage preview"></iframe>
    <div class="preview-overlay" id="preview-overlay">
      <div class="spinner" id="preview-spinner" style="display:block;width:24px;height:24px;border-width:3px"></div>
      <span>Loading page…</span>
    </div>
  </div>

  <!-- RIGHT: findings -->
  <div id="findings-pane">
    <div id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <p>Enter a URL or product text above<br>and click <strong>Analyse</strong>.</p>
    </div>
    <div id="results" style="display:none"></div>
  </div>

</div>

<script>
let activeTab = 'url';
let allFindings = [];

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'url') || (i === 1 && tab === 'text'));
  });
  document.getElementById('tab-url').classList.toggle('active', tab === 'url');
  document.getElementById('tab-text').classList.toggle('active', tab === 'text');
}

async function runAnalysis() {
  const btn     = document.getElementById('analyze-btn');
  const spinner = document.getElementById('spinner');
  const label   = document.getElementById('btn-label');

  btn.disabled = true;
  spinner.style.display = 'block';
  label.textContent = 'Analysing…';
  hideResults();

  if (activeTab === 'url') {
    const url = document.getElementById('url-input').value.trim();
    if (!url) { showError('Please enter a URL.'); btn.disabled=false; spinner.style.display='none'; label.textContent='Analyse'; return; }
    if (!url.match(/^https?:\/\/.+/i)) {
      showError('Please enter a valid URL starting with http:// or https://');
      btn.disabled=false; spinner.style.display='none'; label.textContent='Analyse'; return;
    }
    loadPreview(url);
    await streamUrl(url, btn, spinner, label);
  } else {
    hidePreview();
    const text = document.getElementById('text-input').value.trim();
    if (!text) { showError('Please enter some text.'); btn.disabled=false; spinner.style.display='none'; label.textContent='Analyse'; return; }
    try {
      const resp = await fetch('/analyze/text', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({text}),
      });
      const data = await resp.json();
      if (!resp.ok) { showError(data.detail || 'Server error.'); return; }
      renderResults(data);
    } catch(e) {
      showError('Network error: ' + e.message);
    } finally {
      btn.disabled=false; spinner.style.display='none'; label.textContent='Analyse';
    }
  }
}

async function streamUrl(url, btn, spinner, label) {
  // Initialise streaming results view
  allFindings = [];
  document.getElementById('empty-state').style.display = 'none';
  const r = document.getElementById('results');
  r.style.display = 'block';
  r.innerHTML = `
    <div class="results-header">
      <h2>Results</h2>
      <div class="summary-pills">
        <span class="pill pill-dark" id="pill-dark">0 dark</span>
        <span class="pill pill-clean" id="pill-clean">0 clean</span>
      </div>
    </div>
    <div id="stream-status" style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px">
      Fetching page…
    </div>
    <div class="filter-bar" id="filter-bar" style="display:none"></div>
    <div id="cards-container"></div>`;
  document.getElementById('findings-pane').scrollTop = 0;

  let total = 0;
  let done = 0;

  try {
    const resp = await fetch('/analyze/url', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url}),
    });

    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      showError(data.detail || `Server error ${resp.status}`);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const {value, done: streamDone} = await reader.read();
      if (streamDone) break;
      buf += decoder.decode(value, {stream: true});

      // Process complete SSE lines
      const lines = buf.split('\n');
      buf = lines.pop(); // keep incomplete last line

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (!payload) continue;
        let msg;
        try { msg = JSON.parse(payload); } catch { continue; }

        if (msg.type === 'meta') {
          total = msg.total;
          document.getElementById('stream-status').textContent =
            `Analysing ${total} snippets…  (0 / ${total})`;

        } else if (msg.type === 'finding') {
          done++;
          allFindings.push(msg);
          appendCard(msg, allFindings.length - 1);
          updateSummary();
          if (total) {
            document.getElementById('stream-status').textContent =
              `Analysing snippets…  (${done} / ${total})`;
          }

        } else if (msg.type === 'done') {
          document.getElementById('stream-status').textContent =
            `Done — ${done} snippet${done!==1?'s':''} analysed.`;
          buildFilterBar();
          document.getElementById('filter-bar').style.display = 'flex';

        } else if (msg.type === 'error') {
          // soft error on one snippet — keep going
          done++;
        }
      }
    }
  } catch(e) {
    showError('Network error: ' + e.message);
  } finally {
    btn.disabled=false; spinner.style.display='none'; label.textContent='Analyse';
  }
}

function updateSummary() {
  const dark  = allFindings.filter(f => f.is_dark_pattern).length;
  const clean = allFindings.length - dark;
  document.getElementById('pill-dark').textContent  = `${dark} dark`;
  document.getElementById('pill-clean').textContent = `${clean} clean`;
}

function buildFilterBar() {
  const bar = document.getElementById('filter-bar');
  const labelCounts = {};
  allFindings.forEach(f => {
    if (f.is_dark_pattern) labelCounts[f.label] = (labelCounts[f.label]||0)+1;
  });
  const dark  = allFindings.filter(f => f.is_dark_pattern).length;
  const clean = allFindings.length - dark;
  bar.innerHTML =
    `<button class="filter-btn active" onclick="applyFilter('all',this)">All (${allFindings.length})</button>
     <button class="filter-btn" onclick="applyFilter('dark',this)">Dark (${dark})</button>
     <button class="filter-btn" onclick="applyFilter('clean',this)">Clean (${clean})</button>`
    + Object.entries(labelCounts).map(([lbl,cnt]) =>
        `<button class="filter-btn" onclick="applyFilter(${JSON.stringify(lbl)},this)">${escHtml(lbl)} (${cnt})</button>`
      ).join('');
}

function appendCard(f, i) {
  const container = document.getElementById('cards-container');
  const div = document.createElement('div');
  div.innerHTML = makeCardHtml(f, i);
  container.appendChild(div.firstElementChild);
}

// ── preview pane ────────────────────────────────────────────────────────────

function loadPreview(url) {
  const pane    = document.getElementById('preview-pane');
  const overlay = document.getElementById('preview-overlay');
  const iframe  = document.getElementById('page-iframe');
  const urlBar  = document.getElementById('preview-url-bar');
  const status  = document.getElementById('preview-status');

  pane.classList.add('visible');
  document.getElementById('content-area').classList.remove('no-preview');

  urlBar.textContent = url;
  status.textContent = '';
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="spinner" style="display:block;width:24px;height:24px;border-width:3px;
      border-color:rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;
      animation:spin 0.7s linear infinite"></div>
    <span>Loading page…</span>`;

  const proxyUrl = '/proxy/page?url=' + encodeURIComponent(url);
  iframe.src = proxyUrl;

  iframe.onload = () => {
    overlay.classList.add('hidden');
    status.textContent = '✓ loaded';
  };
  iframe.onerror = () => {
    overlay.innerHTML = '<span style="color:#ef9a9a">Could not load page preview.</span>';
  };
}

function hidePreview() {
  document.getElementById('preview-pane').classList.remove('visible');
  document.getElementById('content-area').classList.add('no-preview');
  document.getElementById('page-iframe').src = '';
}

// ── results ─────────────────────────────────────────────────────────────────

function hideResults() {
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('results').style.display = 'none';
  document.getElementById('results').innerHTML = '';
}

function showError(msg) {
  document.getElementById('empty-state').style.display = 'none';
  const r = document.getElementById('results');
  r.style.display = 'block';
  r.innerHTML = `<div class="error-banner">⚠ ${escHtml(msg)}</div>`;
  document.getElementById('findings-pane').scrollTop = 0;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlightSpan(inputText, span) {
  if (!span) return escHtml(inputText);
  const idx = inputText.indexOf(span);
  if (idx < 0) return escHtml(inputText);
  return escHtml(inputText.slice(0, idx))
    + `<mark class="span-highlight">${escHtml(span)}</mark>`
    + escHtml(inputText.slice(idx + span.length));
}

function renderResults(data) {
  // Used only for /analyze/text (single snippet, no streaming)
  allFindings = data.findings || [];
  document.getElementById('empty-state').style.display = 'none';
  const r = document.getElementById('results');
  r.style.display = 'block';

  const darkCount  = allFindings.filter(f => f.is_dark_pattern).length;
  const cleanCount = allFindings.length - darkCount;
  const labelCounts = {};
  allFindings.forEach(f => {
    if (f.is_dark_pattern) labelCounts[f.label] = (labelCounts[f.label]||0)+1;
  });

  let filterHtml = `<div class="filter-bar">
    <button class="filter-btn active" onclick="applyFilter('all',this)">All (${allFindings.length})</button>
    <button class="filter-btn" onclick="applyFilter('dark',this)">Dark (${darkCount})</button>
    <button class="filter-btn" onclick="applyFilter('clean',this)">Clean (${cleanCount})</button>`
    + Object.entries(labelCounts).map(([lbl,cnt]) =>
        `<button class="filter-btn" onclick="applyFilter(${JSON.stringify(lbl)},this)">${escHtml(lbl)} (${cnt})</button>`
      ).join('') + '</div>';

  r.innerHTML = `
    <div class="results-header">
      <h2>Results</h2>
      <div class="summary-pills">
        <span class="pill pill-dark">${darkCount} dark</span>
        <span class="pill pill-clean">${cleanCount} clean</span>
      </div>
    </div>
    ${filterHtml}
    <div id="cards-container"></div>`;

  renderCards(allFindings);
  document.getElementById('findings-pane').scrollTop = 0;
}

function applyFilter(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  let filtered;
  if      (filter === 'all')   filtered = allFindings;
  else if (filter === 'dark')  filtered = allFindings.filter(f => f.is_dark_pattern);
  else if (filter === 'clean') filtered = allFindings.filter(f => !f.is_dark_pattern);
  else                         filtered = allFindings.filter(f => f.label === filter);
  renderCards(filtered);
}

function renderCards(findings) {
  const container = document.getElementById('cards-container');
  if (!findings.length) {
    container.innerHTML = '<div class="no-results">No results match this filter.</div>';
    return;
  }
  container.innerHTML = findings.map((f, i) => makeCardHtml(f, i)).join('');
}

function makeCardHtml(f, i) {
  const truncated   = f.input_text.length > 70 ? f.input_text.slice(0, 67) + '…' : f.input_text;
  const confPct     = Math.round(f.confidence * 100);
  const barColor    = f.is_dark_pattern ? f.color : '#27ae60';
  const highlighted = highlightSpan(f.input_text, f.evidence_span);
  return `
  <div class="finding-card" id="card-${i}" onclick="toggleCard(${i})">
    <div class="card-header">
      <div class="label-dot" style="background:${f.color}"></div>
      <div style="flex:1;min-width:0">
        <div class="label-name" style="color:${f.color}">${escHtml(f.label)}</div>
        <div class="snippet-preview">${escHtml(truncated)}</div>
      </div>
      <div class="confidence-bar-wrap">
        <div class="confidence-bar-bg">
          <div class="confidence-bar-fill" style="width:${confPct}%;background:${barColor}"></div>
        </div>
        <div class="conf-pct">${confPct}%</div>
      </div>
      <div class="chevron">▼</div>
    </div>
    <div class="card-body">
      <div class="section">
        <div class="section-label">Input Text</div>
        <div class="section-text">${highlighted}</div>
      </div>
      ${f.is_dark_pattern ? `
      <div class="section">
        <div class="section-label">Rationale</div>
        <div class="section-text">${escHtml(f.rationale)}</div>
      </div>
      <div class="section">
        <div class="section-label">Suggested Rewrite</div>
        <div class="rewrite-box">${escHtml(f.rewrite)}</div>
      </div>
      <div class="meta-row">
        <div class="meta-chip"><span>Mechanism</span>${escHtml(f.psychological_mechanism)}</div>
        <div class="meta-chip"><span>Harm</span>${escHtml(f.harm_dimension)}</div>
        ${f.span_exact ? '<div class="meta-chip"><span>Span</span>grounded ✓</div>' : ''}
      </div>` : `
      <div class="section">
        <div class="section-text" style="color:var(--text-muted)">${escHtml(f.rationale)}</div>
      </div>`}
    </div>
  </div>`;
}

function toggleCard(i) {
  document.getElementById(`card-${i}`).classList.toggle('open');
}
</script>
</body>
</html>
